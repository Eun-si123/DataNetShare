# GitHub-native dependency update proposals; all changes require PR review and CI.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    # Uncoordinated major upgrades have broken CI; track migrations in Issue #51.
    # Restricts VERSION proposals only; Dependabot security updates remain enabled.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      android-compatible:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /proxy-tests
    schedule:
      interval: weekly
      day: saturday
      time: "04:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    # Uncoordinated major upgrades have broken CI; track migrations in Issue #51.
    # Restricts VERSION proposals only; Dependabot security updates remain enabled.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      proxy-tests-compatible:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "04:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    # Uncoordinated major upgrades have broken CI; track migrations in Issue #51.
    # Restricts VERSION proposals only; Dependabot security updates remain enabled.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      actions-compatible:
        update-types:
          - minor
          - patch
