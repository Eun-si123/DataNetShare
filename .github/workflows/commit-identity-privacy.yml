name: Commit identity privacy

# Trusted base-branch workflow: inspect PR metadata without executing untrusted PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  inspect-commit-identities:
    name: Commit identity privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check attribution policy cases
        run: node scripts/check-commit-identity.mjs --self-test
      - name: Audit every PR commit without exposing emails in logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-commit-identity.mjs
