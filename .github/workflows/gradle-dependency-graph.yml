name: Submit Gradle dependency graph

# GitHub's manifest-only SBOM misses resolved Android / JVM libraries.
# Trusted default-branch only: never run untrusted PR code with a write token.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'proxy-tests/**'
      - '.github/workflows/gradle-dependency-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datanetshare-gradle-dependency-graph
  cancel-in-progress: true

jobs:
  dependency-graph:
    if: github.ref == 'refs/heads/main'
    name: Submit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [android, proxy-tests]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # pinned v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        if: matrix.project == 'android'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdk_manager"
          "$sdk_manager" --install 'platforms;android-34' 'build-tools;34.0.0'
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Submit resolved dependencies to GitHub
        uses: gradle/actions/dependency-submission@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # pinned v4
        with:
          gradle-version: '8.5'
          build-root-directory: ${{ matrix.project }}
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          artifact-retention-days: 1
