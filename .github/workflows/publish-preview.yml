name: Publish Android preview APK

# A one-time, source-bound prerelease. Future previews require a deliberate dispatch
# or a new workflow revision. Never treat a debug APK as a stable signed release.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datanetshare-preview-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Install Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Run real host protocol/relay tests
        run: gradle -p proxy-tests test --no-daemon
      - name: Run Android unit tests, lint, and build
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Check package and signature, prepare assets
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.datanet.share.dev'"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='36' versionName='5.1-dev.6'"
          "$SIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/DataNetShare-5.1-dev.6-debug.apk
          cd dist
          sha256sum DataNetShare-5.1-dev.6-debug.apk > SHA256SUMS.txt
      - name: Publish immutable GitHub prerelease with direct APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v5.1-dev.6"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace a published APK"
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## DataNet Share 5.1-dev.6 — Android preview (not a stable release)

          **Download:** `DataNetShare-5.1-dev.6-debug.apk` in Assets below (not Source code ZIP).
          Android 8.0+, package `com.datanet.share.dev`. This is a debug-signed development preview, distributed for optional testing.

          ### Better diagnostics for browser and speed-test failures
          - Always-visible network diagnostics on both sender and receiver, with a copy button omitting passwords, endpoints and QR details.
          - Bounded in-memory counters record sender upstream/connection-capacity failures, receiver TCP/UDP flow limits, UDP setup/read failures, TCP resets/timeouts and TUN congestion.
          - Errors are visible even while the sender or VPN stays in the Connected state. An empty log does not prove that browsing or speed tests work.
          - Regression coverage includes journal concurrency/capacity/privacy and formerly swallowed UDP setup failures.

          ### TCP transport improvements in 5.1-dev.6
          - Advertise an explicit 1200-byte MSS in the receiver's TCP SYN-ACK to prevent peer fallback to smaller default segments; preserve checksum and retransmission behavior.
          - Retry congested nonblocking VPN TUN writes for a bounded period instead of immediately discarding on first EAGAIN or EINTR.
          - Unit tests assert TCP MSS option, IPv4/TCP checksums, matching SYN retransmission, and bounded TUN write retries.
          - This is a transport-layer improvement, not a guarantee that Ookla Speedtest, FAST.com or HTTP/3 work on physical Android phones.

          ### Connection reset diagnosis and route fixes
          - When the sender is using "mobile-data only", another connected Wi-Fi is *not* used for Internet egress. If mobile data is missing, new connections now report SOCKS network unreachable (3), rather than a generic connection refused.
          - When "Use Android default route" is selected, the sender no longer unnecessarily requests a separate cellular Network and now displays Android's selected Wi-Fi/VPN/cellular path in stats.
          - Recent upstream errors appear on the sender; the receiver surfaces recent TCP failure categories to aid diagnosis without logging destinations or passwords.
          - A multi-megabyte TCP download regression test now exercises speed-test-like traffic.

          ### New in this preview
          - Session-scoped QR shown only on an active sender. The receiving app has an in-app camera scanner to fill the sender IP, SOCKS port, and session password.
          - QR can include Wi-Fi Direct SSID/password for manual network joining. Receiver can copy the Wi-Fi password and open Android Wi-Fi settings.
          - The QR is invalid after Stop/restart because the proxy password rotates. It is **not single-scan**: anyone with a photo can connect during the active session.
          - The QR scanner does not require cloud access; no credentials are saved to preferences, analytics or log output. Camera permission is needed to scan.
          - Receiver VPN permission pending across Activity rotation is now retained in memory, not the saved-instance bundle.

          ### Fix in this preview
          - Fix a reported Android receiver startup failure: `Sender check failed: Could not protect sender socket`.
          - Select/bind the local Wi-Fi socket before calling Android VPN protection for the credential probe, TCP and UDP flows.
          - Four JVM regression tests cover socket setup and failures. Android device verification remains pending.

          ### Implemented
          - Authenticated SOCKS5 TCP/UDP sharing over Wi-Fi Direct, USB tethering, or a private Wi-Fi network.
          - Mobile-data-only egress by default; optional Android default route for explicit existing-VPN use.
          - Experimental Android IPv4 receiver and Korean UI/help.
          - Host protocol tests, Android JVM tests, lint and APK build checked before release.

          ### Known limitations and security
          - **Real Android-to-Android, OEM, Wi-Fi Direct, battery, and carrier tests are still pending.** Expect connection failures on some devices/networks.
          - Receiver lacks IPv6, ICMP, IP fragment reassembly, and complete TCP interoperability; some games/apps may fail.
          - SOCKS5 authentication is **not encryption**; use a trusted private network or USB. No carrier-tethering-bypass or VPN kill-switch guarantee.
          - **Debug signing key is generated on the CI runner.** A later APK may have a different certificate and require uninstall/reinstall, losing app settings. This is not an update-stable public release.
          - Release APK uses `com.datanet.share.dev` and does not replace the original upstream app.

          See [Korean install guide](https://github.com/Eun-si123/DataNetShare/blob/main/docs/README.ko.md), [test matrix](https://github.com/Eun-si123/DataNetShare/blob/main/docs/TESTING.md), and [security notes](https://github.com/Eun-si123/DataNetShare/blob/main/docs/SECURITY-REVIEW.md).

          **Integrity:** `SHA256SUMS.txt` contains the APK digest. Source is pinned to this release tag.
          NOTES
          gh release create "$TAG" \
            dist/DataNetShare-5.1-dev.6-debug.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DataNet Share 5.1-dev.6 (Android preview)" \
            --prerelease \
            --notes-file release-notes.md
