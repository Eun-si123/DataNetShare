name: Publish Android preview APK

# A one-time, source-bound prerelease. Future previews require a deliberate dispatch
# or a new workflow revision. Never treat a debug APK as a stable signed release.
# Only explicit maintainer dispatch can attempt an immutable release. A workflow
# edit alone must not publish or waste Android build minutes on an existing tag.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datanetshare-preview-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: android-preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Refuse duplicate immutable preview before expensive builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v5.1-dev.21"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Prepare a new version, then explicitly dispatch a new preview."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.5'
      - name: Install Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Run real host protocol/relay tests
        run: gradle -p proxy-tests test --no-daemon
      - name: Run Android unit tests, lint, and build
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Check package and signature, prepare assets
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.datanet.share.dev'"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='51' versionName='5.1-dev.21'"
          "$SIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/DataNetShare-5.1-dev.21-debug.apk
          cd dist
          sha256sum DataNetShare-5.1-dev.21-debug.apk > SHA256SUMS.txt
      - name: Publish immutable GitHub prerelease with direct APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v5.1-dev.21"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace a published APK"
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## DataNet Share 5.1-dev.21 — experimental Android preview

          Android 8+, debug-signed com.datanet.share.dev. Not a production release.

          - RFC 7323 TCP Window Scale is negotiated only with a peer SYN offering WSopt; SYN-ACK includes MSS1400 and shift 2. SYN window is unscaled; subsequent incoming/outgoing advertised windows honor negotiated shifts and bounded 256KiB per-flow queue. Legacy peers retain 65535-byte windows.
          - Receiver aggregate counters for established Window Scale flows and unsupported IPv4 ICMP / IPv6 packets (no protocol support added), without recording addresses or credentials.
          - New browser result shown by user: down 45.60Mbps, up 30.38Mbps, ping 160ms. All speed gains and native Speedtest app compatibility unverified; require repeated on-device A/B versus dev.20.
          - Sender session peer usage: display authenticated SOCKS5 client IPv4 address,
            number of active SOCKS connections, received Internet/download payload bytes and
            uploaded/client-to-Internet payload bytes. Includes successfully relayed TCP and UDP.
            Aggregates sockets per IP; one phone can open 100+ sockets. Does not determine model
            names, count other Wi-Fi-only peers, track visited sites, or persist per-IP history.
            Bounded to 32 tracked IPs, approx 1Hz UI snapshots, cleared after sharing stops.
            Private peer IPs are NOT added to the sanitized "Copy diagnostics" action.
          - User reports ~41.7/37.34 Mbps using browser and YouTube works, while native speed
            test ISP/server discovery fails. Four sender connection-capacity events and ten upstream
            connection failures observed. No claim these issues are fixed or that higher SOCKS
            limits improve speed; safe limits remain.
          - Receiver VPN declares the actual local sender network via Android VpnService.Builder.setUnderlyingNetworks, and refreshes it when the protected SOCKS path changes.
          - Adds privacy-safe Android INTERNET/VALIDATED/VPN/WIFI capability diagnostics for visible VPN and sender link, sampled at most every five seconds.
          - User-reported QR Wi-Fi is local-only: Android can show an exclamation/question mark despite working browser TCP via VPN. No claim that Wi-Fi will display a regular Internet icon, or that native Ookla Speedtest server search now works.
          - Sender Wi-Fi Direct BUSY after uninstall while sharing is active: stop the sharing session before uninstall to allow group teardown; if already orphaned, toggle Wi-Fi or reboot. Do not delete unrelated P2P groups.
          - QR app-requested local-only Wi-Fi is not considered ready from IPv4 assignment alone:
            use that Network's socketFactory to verify the sender's local SOCKS port with
            bounded retries before launching VPN consent. Do not send credentials in readiness
            check, bind the whole process to Wi-Fi, or change saved Android networks.
            Keep manual join fallback for unsupported network requests and unreachable senders.
          - Receiver congestion trial: shared 120-flow TCP/UDP limit with max 112 TCP and 40 UDP, reserving eight sender slots for probes. Reclaim only abandoned half-open or genuinely idle, not active, TCP. UDP queues increase from 32 to 64 packets with bounded memory. Report reclaimed idle TCP and UDP queue overflow counts.
          - QR app-requested Wi-Fi: when Android assigned IPv4 but the sender route is not ready, retry only EHOSTUNREACH/ENETUNREACH up to three times. Do not retry bad SOCKS passwords or VPN permission failures. If necessary check current sender QR/SSID and connect manually.
          - Motivation: v5.1-dev.16 receiver reported 106 TCP capacity rejections, 17 TCP timeouts, 8 UDP queue overflows. No verified speed improvement is claimed.
          - EXPERIMENTAL PERFORMANCE CHANGE: reduce per-packet checksum/header temporary allocations,
            and increase receiver-to-Android TCP MSS from 1200 to 1400 within VPN MTU 1500.
            This does not implement TCP Window Scaling or change upstream routing.
            Speed / CPU / battery benefit is NOT confirmed until identical real-handset A/B runs.
          - Android 10+ QR scan requests an OS-approved Wi-Fi join; upon IPv4 provisioning the app begins the VPN consent flow. Manual Wi-Fi connection remains available on failure. No permission bypass.
          - Optional sender SOCKS5 password (session-memory only) or secure random password when blank. Manually reused passwords allow old QR codes to authenticate.
          - Optional sender cellular-first route with validated Internet Wi-Fi fallback and return to cellular for **new** flows after Android validates recovery. Existing sockets are not migrated.
          - Optional receiver Wi-Fi release and VPN teardown on sender-loss allows Android to select its own mobile/saved Wi-Fi network, never an arbitrary AP.
          - Receiver is still experimental IPv4, no complete TCP congestion control, IPv6 or ICMP; ~30 Mbps throughput report is not fixed.
          - OEM Wi-Fi Direct join, system approval, carrier routing and fallback behavior require physical-device tests. SOCKS authentication is not local-link encryption.
          - Future debug APK signing identities may change; uninstall/reinstall may be required.

          Tests and limitations: docs/TESTING.md
          NOTES
          gh release create "$TAG" \
            dist/DataNetShare-5.1-dev.21-debug.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DataNet Share 5.1-dev.21 (Android preview)" \
            --prerelease \
            --notes-file release-notes.md
