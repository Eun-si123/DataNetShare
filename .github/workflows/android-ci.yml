name: Android source verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

# A PR already verifies feature branches; avoid duplicate push builds.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Hosted Ubuntu runners already have Android command-line tools.
      # setup-android@v3 calls the removed SDK package "tools" and fails in 2026.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Install Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Unit tests and debug APK compile
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK (not release-signed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: datanetshare-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
