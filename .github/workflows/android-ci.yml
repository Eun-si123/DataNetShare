name: Android source verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'android/**'
      - 'proxy-tests/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

# A PR already verifies feature branches; avoid duplicate push builds.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Guard against untested Gradle / Kotlin version drift
        run: |
          python3 -m unittest discover -s scripts -p 'test_build_toolchain_alignment.py' -q
          python3 scripts/check_build_toolchain_alignment.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: '8.5'
      - name: Real loopback protocol tests (no Android SDK)
        run: gradle -p proxy-tests test --no-daemon
      - name: Upload host test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: datanetshare-host-tests
          path: proxy-tests/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Guard against untested Gradle / Kotlin version drift
        run: |
          python3 -m unittest discover -s scripts -p 'test_build_toolchain_alignment.py' -q
          python3 scripts/check_build_toolchain_alignment.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      # Hosted Ubuntu runners already have Android command-line tools.
      # setup-android@v3 calls the removed SDK package "tools" and fails in 2026.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
        with:
          gradle-version: '8.5'
      - name: Install Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Unit tests, Android lint and debug APK compile
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon
      - name: Upload Android validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: datanetshare-android-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload debug APK (not release-signed)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: datanetshare-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
