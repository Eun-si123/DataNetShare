name: Android source verification

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Hosted Ubuntu runners already have Android command-line tools.
      # setup-android@v3 calls the removed SDK package "tools" and fails in 2026.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Install Android SDK 34
        run: |
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Unit tests and debug APK compile
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK (not release-signed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: datanetshare-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
