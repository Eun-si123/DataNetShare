name: CodeQL advanced (Android Kotlin, Actions and Python)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 2 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-advanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope (fail open)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed PR or push files
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_changed_files.py
  analyze:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    permissions:
      contents: read
      security-events: write
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure JDK 17 for Kotlin
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle 8.13 for Kotlin
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.6'
          # Reuse main CI's Gradle cache; analysis must not crowd out hot entries.
          cache-read-only: true

      - name: Install Android SDK 35 for Kotlin compilation
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdk_manager"
          "$sdk_manager" --install 'platforms;android-35' 'build-tools;35.0.0'
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Initialize CodeQL (language-specific build mode)
        uses: github/codeql-action/init@776237d428f23fefc3d9e0fe1962921cbcd53e17 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The repository contains TWO independent Gradle roots (android/ and
      # proxy-tests/). CodeQL's default autobuilder fails to choose one.
      # Explicit commands ensure Kotlin source is actually compiled and traced.
      - name: Build Android and JVM protocol sources for CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --no-daemon --max-workers=2
          gradle -p proxy-tests classes --no-daemon --max-workers=2

      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          category: '/language:${{ matrix.language }}'
