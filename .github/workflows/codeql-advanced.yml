name: CodeQL advanced (Android Kotlin, Actions and Python)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 2 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-advanced-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure JDK 17 for Kotlin
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle 8.5 for Kotlin
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.5'

      - name: Install Android SDK 34 for Kotlin compilation
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdk_manager"
          "$sdk_manager" --install 'platforms;android-34' 'build-tools;34.0.0'
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Initialize CodeQL (language-specific build mode)
        uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The repository contains TWO independent Gradle roots (android/ and
      # proxy-tests/). CodeQL's default autobuilder fails to choose one.
      # Explicit commands ensure Kotlin source is actually compiled and traced.
      - name: Build Android and JVM protocol sources for CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --no-daemon --max-workers=2
          gradle -p proxy-tests classes --no-daemon --max-workers=2

      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          category: '/language:${{ matrix.language }}'
